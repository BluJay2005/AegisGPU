[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amlnet"
version = "0.1.0"
description = "GPU-accelerated financial fraud & AML network analyzer (RAPIDS cuDF/cuGraph, PostgreSQL + pgvector, NVIDIA NIM)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "networkx>=3.0", "matplotlib>=3.7"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
amlnet = "amlnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
